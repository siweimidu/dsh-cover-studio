# @local/dsh-cover-studio bundle patch
# Inserts one row into the profile roster. The browser half is driven by the
# `dsh.client` declaration in package.json, not by a second row.
- insert:
    - id: cover-studio
      name: '@local/dsh-cover-studio'
      config:
        # Directory that holds the shared cover templates (HTML).
        templateDir: 'templates'
        # Default export scale factor (2 = retina).
        exportScale: 2
        # EdgeTTS bundle the user has installed. The plugin also probes the
        # system python, which usually carries a newer edge-tts.
        ttsDir: 'D:/ruanjian/EdgeTTS/yzylauncher-edge-tts-win/yzylauncher-edge-tts-win'
